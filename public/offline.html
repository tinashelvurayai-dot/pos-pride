<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TillPoint</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1d4ed8" />
    <style>
      html, body { margin: 0; height: 100%; background: #f7faf8; color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", Segoe UI, Roboto, sans-serif; }
      .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
      .card { max-width: 420px; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 16px; color: #475569; font-size: 14px; }
      button { background: #1d4ed8; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>TillPoint is loading…</h1>
        <p id="msg">Reconnecting. This screen appears only while the app boots.</p>
        <button onclick="location.reload()">Retry</button>
      </div>
    </div>
    <script>
      // Auto-retry when back online, and periodically try to reach the real app.
      function tryReload() { location.replace('/'); }
      window.addEventListener('online', tryReload);
      setTimeout(tryReload, 1500);
    </script>
  </body>
</html>
